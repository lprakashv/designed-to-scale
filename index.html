<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Board</title>
  <link rel="icon" href="./_board/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./_board/course.css">
  <script type="module" src="./_board/app.js"></script>
</head>
<body>
  <a class="skip" href="#lesson">Skip to lesson</a>
  <div class="layout">
    <aside id="outline" class="outline" aria-label="Course outline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v14H4zM9 5v14m3-9h5m-5 4h3"/></svg>
        </span>
        <div><strong id="course-name"></strong><p id="course-description"></p></div>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
        <input id="search" type="search" placeholder="Find a lesson" aria-label="Find a lesson">
      </label>
      <nav id="chapters" aria-label="Chapters"></nav>
      <div class="progress">
        <p><span>Course progress</span><span id="progress-text"></span></p>
        <progress id="progress" aria-label="Course progress"></progress>
      </div>
    </aside>
    <div class="workspace">
      <header class="top">
        <button id="outline-toggle" aria-expanded="false" aria-controls="outline" type="button">Course outline</button>
        <p id="breadcrumb"></p>
        <p id="mobile-course-name"></p>
        <p id="lesson-count"></p>
      </header>
      <main id="lesson" tabindex="-1" aria-busy="true"></main>
    </div>
  </div>
  <noscript>Enable JavaScript to open this course.</noscript>
</body>
</html>
