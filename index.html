<!doctype html>
<html lang="en" data-course-id="designed-to-scale" data-theme="slate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Design</title>
  <meta property="og:title" content="System Design">
  <meta name="twitter:title" content="System Design">
  <meta name="description" content="Learn system design one step at a time.">
  <meta property="og:description" content="Learn system design one step at a time.">
  <meta name="twitter:description" content="Learn system design one step at a time.">
  <script>
    {
      const root = document.documentElement;
      const path = location.pathname.replace(/index\.html$/, '');
      const key = `course-board:${path}:${root.dataset.courseId}:color-mode`;
      try {
        const mode = localStorage.getItem(key);
        if (mode === 'light' || mode === 'dark') root.dataset.colorMode = mode;
      } catch { /* The course default also works without storage. */ }

      document.addEventListener('DOMContentLoaded', () => {
        const control = document.getElementById('color-mode');
        control.value = root.dataset.colorMode ?? '';
        control.addEventListener('change', () => {
          if (control.value) root.dataset.colorMode = control.value;
          else delete root.dataset.colorMode;
          try { localStorage.setItem(key, control.value); }
          catch { /* The choice still applies to the current page. */ }
        });
      });
    }
  </script>
  <link rel="icon" href="./_board/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./_board/course.css">
  
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-P54692MZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
  </script>
  <script type="module" src="./_board/app.js"></script>
</head>
<body>
  <a class="skip" href="#lesson">Skip to content</a>
  <div class="layout">
    <aside id="outline" class="outline" aria-label="Course outline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v14H4zM9 5v14m3-9h5m-5 4h3"/></svg>
        </span>
        <div><strong id="course-name"></strong><p id="course-description"></p></div>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
        <input id="search" type="search" placeholder="Find a lesson" aria-label="Find a lesson">
      </label>
      <nav id="chapters" aria-label="Chapters"></nav>
      <div class="progress">
        <p><span>Course progress</span><span id="progress-text"></span></p>
        <progress id="progress" aria-label="Course progress"></progress>
      </div>
    </aside>
    <div id="outline-divider" class="pane-divider" role="separator" aria-label="Course outline width"
      aria-orientation="vertical" aria-controls="outline" tabindex="0"></div>
    <div class="workspace">
      <header class="top">
        <button id="outline-toggle" aria-label="Course outline" aria-expanded="false" aria-controls="outline" type="button">Outline</button>
        <a class="home-link" href="#/">Home</a>
        <p id="breadcrumb"></p>
        <p id="mobile-course-name"></p>
        <p id="lesson-count"></p>
        <label class="theme-control">Theme
          <select id="color-mode" aria-label="Color theme">
            <option value="">Default</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </header>
      <main id="lesson" tabindex="-1" aria-busy="true"></main>
    </div>
  </div>
  <noscript>Enable JavaScript to open this course.</noscript>
</body>
</html>
