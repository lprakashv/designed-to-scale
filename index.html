<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive system design study course.">
  <title>System Design — Local Course</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="course-header">
    <a class="brand" href="#/" aria-label="System Design home">
      <span class="brand-name">System Design</span><span class="brand-short" aria-hidden="true">SD</span>
    </a>
    <button id="search-toggle" class="icon-button" aria-label="Search lessons" aria-controls="search-panel" aria-expanded="false" title="Search lessons">⌕</button>
    <div id="search-panel" class="search" role="search">
      <label class="sr-only" for="search">Search lessons</label>
      <input id="search" type="search" placeholder="Search lessons">
      <kbd aria-hidden="true">/</kbd>
      <button id="search-close" class="icon-button" aria-label="Close search" title="Close search">×</button>
    </div>
    <button id="theme" class="icon-button" aria-label="Switch theme" title="Switch theme">◐</button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="course-sidebar">
      <nav id="course" aria-label="Course lessons"></nav>
    </aside>
    <div id="navigation-divider" class="pane-divider" data-resize="nav" role="separator" aria-orientation="vertical" aria-label="Course navigation width" aria-controls="course-sidebar" tabindex="0"></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <script type="importmap">{"imports":{"roughjs":"./assets/rough.js"}}</script>
  <script type="module" src="app.js"></script>
</body>
</html>
