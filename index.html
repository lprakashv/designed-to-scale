<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive system design study course.">
  <title>System Design — Local Course</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">System Design</a>
    <label class="search"><span class="sr-only">Search lessons</span><input id="search" type="search" placeholder="Search"><kbd aria-hidden="true">/</kbd></label>
    <button id="theme" class="icon-button" aria-label="Switch theme" title="Switch theme">◐</button>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <details id="course-menu" open>
        <summary class="sidebar-heading">Course <span id="lesson-count"></span></summary>
        <nav id="course" aria-label="Course lessons"></nav>
        <div id="progress" class="progress"></div>
      </details>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
