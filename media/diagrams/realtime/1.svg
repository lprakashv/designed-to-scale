<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 204" width="1024" height="204" role="img" aria-label="Server (in focus): Source of updates. Client (in focus): Displays updates. One poll per interval. Flow: Client to Server: Poll for changes. Server to Client: Return latest state.">
<style>.node-stroke,.arrow-ink,.arrow-halo{fill:none;stroke-linecap:round;stroke-linejoin:round}
