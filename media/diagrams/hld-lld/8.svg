<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 652" width="1024" height="652" role="img" aria-label="Client (in focus): Creates and reads notes. Requirements (in focus): Scope and targets. Tie choices to requirements. Load balancer (in focus): Routes requests. Note API (in focus): Validates and handles notes. Note store (in focus): Persists notes and owners. Owner index (in focus): Lists notes by owner. Monitoring (in focus): Checks targets and failures. Flow: Client to Load balancer: Submit request. Load balancer to Note API: Route to API. Note API to Note store: Validate and save. Note store to Owner index: Use the owner index. Note API to Monitoring: Check targets. Client to Requirements: Define needs.">
