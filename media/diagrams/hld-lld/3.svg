<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 428" width="1024" height="428" role="img" aria-label="Client (in focus): Creates and reads notes. Requirements (context): Scope and targets. Load balancer (added) (in focus): Routes requests. Note API (added) (in focus): Validates and handles notes. Stateless API instances. Note store (added) (in focus): Persists notes and owners. Flow: Client to Load balancer: Create or read. Load balancer to Note API: Route to API. Note API to Note store: Read or write note. Note store to Note API: Return store result. Note API to Load balancer: Return HTTP result. Load balancer to Client: Relay the response.">
